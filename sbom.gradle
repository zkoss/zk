// a build outside zkcml's, e.g. zklinter's, finds the ZK modules it depends on in zkcml (sbomExtra.root) or in zk
def moduleDir = { String name ->
	if (name == rootProject.name) return rootProject.projectDir
	rootProject.findProject(":$name")?.projectDir ?: [extra.root, zkRoot].findAll().collect { new File(it, name) }.find { new File(it, 'src').isDirectory() } ?: new File(zkRoot, name)
}
def jarOf = { String name, version -> new File(moduleDir(name), "build/libs/${name}-${version}.jar") }
def importSpec = ~/(?:require\(\s*|import\s+(?!type\s)(?:[^'"]*?\s+from\s+)?|export\s+[^'"]*?\s+from\s+)['"]([^'"]+)['"]/
def npmChain = ~/((?:node_modules\/(?:@[\w.-]+\/)?[\w.-]+\/)+)/ // a bundled module's path, nested installs included

def resolveVendored = { Collection modules ->
	def problems = [] as LinkedHashSet
	def resolved = modules.collectEntries { module ->
		def resources = new File(moduleDir(module), 'src/main/resources')
		def files = sbomVendored[module] ?: []
		def listed = (files*.file + files*.also.flatten().findAll()) as Set
		def path = { File f -> resources.canonicalFile.toURI().relativize(f.canonicalFile.toURI()).path }
		def js = rootProject.fileTree(new File(resources, 'web/js'))
		js.matching { include '**/ext/**'; exclude '**/*.d.ts', '**/.*', '**/.*/**' }.each { f ->
			if (!listed.contains(path(f))) problems << "${module}: ${path(f)} is not listed in sbomVendored".toString()
		}
		js.matching { include '**/*.ts'; exclude '**/*.d.ts' }.each { ts ->
			(ts.text =~ importSpec).findAll { match, spec -> spec.startsWith('.') }.each { match, spec ->
				def target = ['', '.js', '.mjs', '.ts', '/index.ts'].collect { new File(ts.parentFile, spec + it) }.find { it.isFile() }
					?: new File(ts.parentFile, spec ==~ /.*\.m?js/ ? spec : "${spec}.js") // generated by the build
				if (!target.name.endsWith('.ts') && !listed.contains(path(target)))
					problems << "${module}: ${path(target)} is not listed in sbomVendored".toString()
			}
		}
		[(module): files.collect { v ->
			def src = v.from ? new File(moduleDir(module), v.from) : new File(resources, v.file)
			def version = v.version
			// the `also` files are checked with the entry's own: each must carry the stamp at the same version, or match its own sha256
			def checked = [(v.from ?: v.file): src] + (v.also ?: []).collectEntries { [(it): new File(resources, it)] }
			if (v.stamp) {
				def m = src.getText('ISO-8859-1') =~ v.stamp
				if (m.find()) version = m.groupCount() ? m.group(1) : version // a stamp without a group only checks the copy is still there
				else problems << "${module}: ${v.from ?: v.file} no longer matches ${v.stamp}"
				checked.drop(1).each { name, f ->
					def other = f.getText('ISO-8859-1') =~ v.stamp
					if (!other.find() || (other.groupCount() && other.group(1) != version)) problems << "${module}: ${name} no longer matches ${v.stamp} at ${version}"
				}
			} else {
				def pins = v.sha256 instanceof List ? v.sha256 : [v.sha256]
				if (pins.size() != checked.size()) problems << "${module}: ${v.from ?: v.file} pins ${pins.size()} sha256 for ${checked.size()} files"
				else checked.eachWithIndex { name, f, i -> // autocrlf checkouts hash as LF
					if (f.getText('ISO-8859-1').normalize().getBytes('ISO-8859-1').sha256() != pins[i]) problems << "${module}: ${name} changed; check its version, then update its sha256"
				}
			}
			v + [version: version, purl: v.npm ? "pkg:npm/${v.npm.replace('@', '%40')}@${version}".toString() : v.purl]
		}]
	}
	(new File(zkRoot, 'scripts/build-css.js').text =~ /node_modules\/((?:@[\w.-]+\/)?[\w.-]+)/).each { match, name ->
		if (!(name in npmAssetNames)) problems << "scripts/build-css.js copies npm package ${name}; list it in npmAssets".toString()
	}
	if (problems)
		throw new GradleException("SBOM: update sbom.gradle:\n  ${problems.join('\n  ')}")
	resolved
}

