def extraJars = [zkbind: [[artifact: 'zkbind-api', task: 'zkbindAPIJar', drop: 'zul'], [artifact: 'zkbind-impl', task: 'zkbindIMPLJar']]]
tasks.matching { it.name in ['cyclonedxBom', 'cyclonedxBomPe'] }.configureEach { task ->
	task.outputs.upToDateWhen { false } // its inputs miss the vendored files and jars read below
	rootProject.subprojects.each { p ->
		p.plugins.withId('java') {
			task.dependsOn(p.tasks.named('jar'))
			task.dependsOn(p.tasks.matching { it.name in (extraJars[p.name] ?: [])*.task })
			task.mustRunAfter(p.tasks.matching { it.name == 'evalJar' })
		}
	}
	task.doLast {
		def bomFile = new File(task.destination.get(), "${task.outputName.get()}.json")
		def evalFile = new File(bomFile.parentFile, "${task.outputName.get()}-eval.json")
		try {
			def bom = new JsonSlurper().parse(bomFile)
			def problems = []
			def isZk = { Map c -> c.group in ['org.zkoss.zk', 'org.zkoss.common'] && c.version == projectVersion }
			def isOwn = { Map c -> extra.licence && (c.name == rootProject.name || rootProject.findProject(":${c.name}") || (extra.root && new File(extra.root, "${c.name}/src").isDirectory())) }
			// a ZK module a build resolves from a repository, e.g. zklinter's zkmax, is read from that jar, not from a local module build
			def resolvedJars = (runtimeClasspath?.resolvedConfiguration?.resolvedArtifacts ?: [])
				.collectEntries { a -> [("${a.moduleVersion.id.group}:${a.name}:${a.moduleVersion.id.version}".toString()): a.file] }
			def jarFor = { Map c -> resolvedJars["${c.group}:${c.name}:${c.version}".toString()] ?: jarOf(c.name, c.version) }
			def digest = { InputStream input ->
				def mds = ['SHA-256', 'SHA-512'].collectEntries { [(it): MessageDigest.getInstance(it)] }
				input.withCloseable { it.eachByte(65536) { byte[] buf, int n -> mds.values()*.update(buf, 0, n) } }
				mds.collect { alg, md -> [alg: alg, content: md.digest().encodeHex().toString()] }
			}
			def fileProps = { String filename, boolean executable, boolean archive ->
				(filename ? [[name: 'bsi:component:filename', value: filename]] : []) + [
					[name: 'bsi:component:executable', value: executable ? 'executable' : 'non-executable'],
					[name: 'bsi:component:archive', value: archive ? 'archive' : 'no archive'],
					[name: 'bsi:component:structured', value: archive ? 'structured' : 'unstructured']]
			}
			// TR-03183-2 reads the deployable's hash from a distribution reference, not from `hashes`
			def addHash = { Map c, String url, List hashes ->
				if (!c.hashes) c.hashes = hashes
				c.externalReferences = (c.externalReferences ?: []).findAll { it.type != 'distribution' } + [[type: 'distribution', url: url, hashes: hashes.findAll { it.alg == 'SHA-512' }]]
			}
			def licenceOf = { Map c ->
				if (isZk(c) || c.is(bom.metadata.component)) return isOwn(c) ? extra.licence : (zkModuleLicences[c.name] ?: zkLicence)
				def key = "${c.group}:${c.name}"
				def listed = sbomLicences["$key:${c.version}"] ?: sbomLicences[key]
				if (listed) return listed
				def ids = c.licenses*.license*.id
				if (ids && !ids.contains(null)) return ids.join(' OR ') // a POM listing several licences offers a choice
				problems << "no SPDX licence for $key; add it to sbomLicences"
				null
			}
			def enrich = { Map c ->
				def creator = sbomCreators.findAll { k, v -> c.group == k || c.group.startsWith("${k}.") }.max { it.key.length() }?.value
				if (creator) {
					c.supplier = creator
					c.manufacturer = creator
				} else problems << "no creator for ${c.group}:${c.name}; add its group to sbomCreators"
				def licence = licenceOf(c)
				if (licence) c.licenses = [[expression: licence, acknowledgement: 'concluded']]
				if (c.purl?.contains('type=jar')) {
					def jar = isZk(c) ? jarFor(c) : null
					def hashes = c.hashes ?: (jar?.exists() ? digest(jar.newInputStream()) : null)
					if (hashes) addHash(c, c.purl, hashes)
					else logger.warn("SBOM: no hash for ${c.purl}")
					c['properties'] = (c['properties'] ?: []) + fileProps("${c.name}-${c.version}.jar", true, true)
				}
			}

			enrich(bom.metadata.component)
			bom.components.each(enrich)

			// a single-jar build's own jar, e.g. zklinter's, can hold copied code too
			def subject = bom.metadata.component
			// sorted, since the plugin lists components in no fixed order and the first copy of an upstream takes its purl as ref
			def owners = (bom.components.findAll(isZk) + (isZk(subject) && subject.purl?.contains('type=jar') ? [subject] : [])).sort { it.name }
			def vendoredRefs = [] as Set
			def usedRefs = [] as Set
			def vendored = resolveVendored(owners*.name)
			// dependsOn may name another module's copy, e.g. zkmax's jQuery plugins zk's jquery
			def vendoredPurls = vendored.values().flatten().collectEntries { [(it.name): it.purl] }
			vendored.each { module, resolved ->
				def owner = owners.find { it.name == module }
				// an `also` file belongs to the same library: same purl, but its own filename and hash
				// the same upstream copied into two modules keeps one purl, so the second copy takes a ref of its own
				def files = resolved.collectMany { v -> [v + [ref: usedRefs.add(v.purl) ? v.purl : "${owner.purl}#${v.name}".toString()]] +
					(v.multi ? [] : (v.also ?: []).collect { f -> v + [file: f, ref: "${owner.purl}#${f}".toString(), dependsOn: null] }) }
				def jar = jarFor(owner)
				files.each { v ->
					def patched = v.patched || !v.creator
					def creator = patched ? potix : v.creator
					def c = [type: 'library', 'bom-ref': v.ref, supplier: creator, manufacturer: creator, name: v.name, version: v.version, purl: v.purl]
					c.licenses = [[expression: v.licence, acknowledgement: 'concluded']]
					// an entry versioned by the date of Potix's last commit names the upstream release it came from in `upstream`, null when there is none
					def upstream = v.containsKey('upstream') ? v.upstream : v.version
					if (patched) c.pedigree = [
						// a maven or npm purl takes the release version; a github one would need a tag, which the table does not record
					ancestors: [[type: 'library', name: v.name] + (upstream ? [version: upstream] : [:])
						+ [purl: upstream && v.purl ==~ /pkg:(maven|npm)\/[^@]+/ ? "${v.purl}@${upstream}".toString() : v.purl] + (v.creator ? [supplier: v.creator] : [:])],
						patches  : [[type: 'unofficial']],
						notes    : 'Copy bundled in ZK and patched for it, maintained by Potix' + (upstream == v.version ? '; keeps the upstream version so advisories still match' : '')]
					// a component of several files, e.g. Java sources compiled into many classes, has no single filename or hash
					c['properties'] = fileProps(v.multi ? null : new File(v.file).name, v.executable != false, false)
					if (!v.multi) {
						def hashes = jar.exists() ? new ZipFile(jar).withCloseable { z -> z.getEntry(v.file)?.with { e -> digest(z.getInputStream(e)) } } : null
						if (hashes) addHash(c, "${owner.purl}#${v.file}".toString(), hashes)
						else logger.warn("SBOM: no hash for ${v.file}, ${jar} is not built or lacks it")
					}
					bom.components << c
					def deps = (v.dependsOn ?: []).collect { vendoredPurls[it] }
					if (deps.contains(null)) problems << "${module}: ${v.name} depends on ${v.dependsOn}, not all of them vendored"
					bom.dependencies << [ref: v.ref, dependsOn: deps.findAll()]
				}
				vendoredRefs.addAll(files*.purl)
				if (files) bom.dependencies.find { it.ref == owner.'bom-ref' }.dependsOn += files*.ref
			}

			// npm packages webpack bundled, read from each module's built bundles
			def locks = readLocks()
			def npm = [:]
			def bundlesRead = true // false once a module with web/js has no jar, e.g. an included build's that was not built
			owners.each { owner ->
				def jar = jarFor(owner)
				if (!jar.exists()) {
					logger.warn("SBOM: npm packages of ${owner.name} not listed, ${jar} is not built")
					if (new File(moduleDir(owner.name), 'src/main/resources/web/js').isDirectory()) bundlesRead = false
					return
				}
				def texts = new ZipFile(jar).withCloseable { z ->
					def bundles = z.entries().findAll { it.name.endsWith('.src.js') }
					if (!bundles && z.entries().find { it.name.startsWith('web/js/') && it.name.endsWith('.js') })
						problems << "${jar.name} has no .src.js bundles to read its npm packages from"
					bundles.collect { e -> z.getInputStream(e).getText('UTF-8') }
				}
				npmPackages(owner.name, texts, locks).each { n ->
					if (!n.entry) return problems << "${owner.name} bundles ${n.key}, which no package-lock.json lists" // else `complete` below would not hold
					def purl = "pkg:npm/${n.name.replace('@', '%40')}@${n.entry.version}".toString()
					if (purl in vendoredRefs) return
					npm.computeIfAbsent(purl) { [name: n.name, entry: n.entry, owners: [] as Set] }.owners << owner.'bom-ref'
				}
			}
			npm.each { purl, n ->
				def creator = npmCreators.find { k, v -> n.name == k || n.name.startsWith("${k}/") }?.value
				def licence = npmLicence(n)
				if (!creator) problems << "no creator for npm package ${n.name}; add it to npmCreators"
				if (!licence) problems << "no SPDX licence for npm package ${n.name}; add it to npmLicences"
				def c = [type: 'library', 'bom-ref': purl, supplier: creator, manufacturer: creator, name: n.name, version: n.entry.version, purl: purl,
				         licenses: [[expression: licence, acknowledgement: 'concluded']], properties: fileProps(null, !(n.name in npmAssetNames), false)]
				if (n.entry.integrity?.startsWith('sha512-'))
					addHash(c, n.entry.resolved, [[alg: 'SHA-512', content: n.entry.integrity.substring(7).decodeBase64().encodeHex().toString()]])
				bom.components << c
				def deps = (n.entry.dependencies ?: [:]).keySet().collect { d -> npm.find { k, o -> o.name == d }?.key }.findAll()
				bom.dependencies << [ref: purl, dependsOn: deps]
			}
			def depended = bom.dependencies.findAll { npm[it.ref] }*.dependsOn.flatten() as Set
			owners.each { owner ->
				def imported = rootProject.fileTree(new File(moduleDir(owner.name), 'src/main/resources/web/js')).matching { include '**/*.ts'; exclude '**/*.d.ts' }
					.collectMany { ts -> (ts.text =~ importSpec).findAll { match, spec -> !spec.startsWith('.') }.collect { match, spec -> spec.split('/').take(spec.startsWith('@') ? 2 : 1).join('/') } } as Set
				def direct = npm.findAll { purl, n -> owner.'bom-ref' in n.owners && (n.name in imported || !depended.contains(purl)) }.keySet()
				if (direct) bom.dependencies.find { it.ref == owner.'bom-ref' }.dependsOn += direct
			}

			// a module's extra published jars, e.g. zkbind-api and zkbind-impl, only in the build that makes them
			owners.each { owner ->
				def p = rootProject.findProject(":${owner.name}")
				if (!p) return
				(extraJars[owner.name] ?: []).each { x ->
					def file = p.tasks.findByName(x.task)?.archiveFile?.get()?.asFile
					def purl = "pkg:maven/${owner.group}/${x.artifact}@${owner.version}?type=jar".toString()
					def c = [type: 'library', 'bom-ref': purl, supplier: potix, manufacturer: potix, group: owner.group, name: x.artifact, version: owner.version,
					         purl: purl, licenses: owner.licenses, properties: fileProps("${x.artifact}-${owner.version}.jar", true, true)]
					if (file?.exists()) addHash(c, purl, digest(file.newInputStream()))
					else logger.warn("SBOM: no hash for ${purl}, ${file} is not built")
					bom.components << c
					def deps = bom.dependencies.find { it.ref == owner.'bom-ref' }?.dependsOn ?: []
					bom.dependencies << [ref: purl, dependsOn: x.drop ? deps.findAll { it.contains('?type=jar') && !it.contains("/${x.drop}@") } : deps]
					bom.dependencies.find { it.ref == bom.metadata.component.'bom-ref' }?.dependsOn?.add(purl)
				}
			}

			if (problems)
				throw new GradleException("SBOM:\n  ${problems.join('\n  ')}")
			bom.metadata.lifecycles = [[phase: 'build']]
			bom.metadata.manufacturer = potix
			bom.metadata.supplier = potix
			bom.compositions = [[aggregate: bundlesRead ? 'complete' : 'incomplete', dependencies: bom.dependencies*.ref]]
			bomFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(bom))

			// deploy-script makes the Eval SBOM by renaming versions, but EE Eval jars differ from the official ones
			def evalHashes = bom.components.findAll { isOwn(it) && rootProject.findProject(":${it.name}") && it.purl?.contains('type=jar') }.collectEntries { c ->
				def jar = new File(moduleDir(c.name), "build/libs/eval/${c.name}-${c.version}.jar")
				jar.exists() ? [(c.'bom-ref'): digest(jar.newInputStream())] : [:]
			}
			evalFile.delete()
			if (evalHashes) {
				def eval = new JsonSlurper().parseText(bomFile.text)
				eval.serialNumber = "urn:uuid:${UUID.randomUUID()}".toString()
				// the Eval distribution ships zkcml's cmldoc/LICENSE, a trial agreement, instead of the official licence
				([eval.metadata.component] + eval.components).findAll(isOwn).each { it.licenses = [[expression: extra.evalLicence, acknowledgement: 'concluded']] }
				eval.components.findAll { evalHashes[it.'bom-ref'] }.each { c ->
					c.hashes = evalHashes[c.'bom-ref']
					def dist = c.externalReferences?.find { it.type == 'distribution' }
					if (dist) dist.hashes = c.hashes.findAll { it.alg == 'SHA-512' }
					else addHash(c, c.purl, c.hashes) // the official jar was not built
				}
				evalFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(eval))
			}
		} catch (e) {
			bomFile.delete() // never ship the plugin's raw output in place of the enriched one
			evalFile.delete() // nor the previous run's Eval SBOM
			throw e
		}
	}
}
