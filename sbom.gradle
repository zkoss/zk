// npm packages in a module: its npmAssets, then each node_modules path its .src.js bundles name, looked up in zk's lock first,
// as webpack resolves zk's node_modules first
def readLocks = { [zkRoot, extra.root ?: rootDir].unique().collect { [it, new JsonSlurper().parse(new File(it, 'package-lock.json')).packages] } }
def npmPackages = { String module, Collection<String> bundleTexts, List locks ->
	def keys = (npmAssets[module] ?: []).collect { "node_modules/${it}".toString() } as Set
	bundleTexts.each { text -> (text =~ npmChain).each { match, chain -> keys << chain[0..-2] } }
	keys.collect { key -> // entry is null for a package no lock lists, which the callers report rather than leave out
		def hit = locks.findResult { root, packages -> packages[key] ? [new File(root, key), packages[key]] : null }
		[key: key, name: key.substring(key.lastIndexOf('node_modules/') + 13), entry: hit?.getAt(1), dir: hit?.getAt(0)]
	}
}
def npmLicence = { Map n -> npmLicences[n.name] ?: (n.entry.license instanceof String ? n.entry.license : null) }

def noticeDirs = [rootDir, zkRoot].unique().collect { new File(it, 'licenses') }
def apacheText = new File(zkRoot, 'licenses/Apache-2.0.txt')
def apacheBlock = ~/(?s)\s*Apache License\s+Version 2\.0, January 2004.*?END OF TERMS AND CONDITIONS(\s*APPENDIX: How to apply the Apache License.*?limitations under the License\.)?/
def readText = { File f -> f.getText('UTF-8').replace('\r', '').trim() }
// The jar's own licence opens its META-INF/LICENSE; zkcml names its own with sbomExtra.licenceFile
def ownLicence = { Project p ->
	if (extra.licenceFile) return readText(new File(rootDir, extra.licenceFile)) + (extra.licenceNote ? "\n\n${extra.licenceNote}" : '')
	readText(zkModuleLicences[p.name] == 'Apache-2.0' ? apacheText : new File(zkRoot, 'LICENSE'))
}
// META-INF/LICENSE and NOTICE in the Spring / Tomcat layout: the jar's own licence, then each third-party subcomponent's
def writeLicence = { Project p, File out ->
	def problems = []
	def comps = []
	def web = p.file('src/main/resources/web/js').isDirectory()
	resolveVendored([p.name])[p.name].each { v -> comps << [name: v.name, version: v.version, licence: v.licence] }
	def bundles = p.fileTree('codegen/resources').matching { include '**/*.src.js' }
	if (web && bundles.isEmpty()) logger.warn("META-INF/LICENSE: ${p.name} has no .src.js bundles, its npm packages are not listed")
	npmPackages(p.name, bundles.collect { it.getText('UTF-8') }, readLocks()).each { n ->
		if (!n.entry) return problems << "${p.name} bundles ${n.key}, which no package-lock.json lists"
		def licence = npmLicence(n)
		if (!licence) problems << "no SPDX licence for npm package ${n.name}; add it to npmLicences in sbom.gradle"
		comps << [name: n.name, version: n.entry.version, licence: licence, dir: n.dir]
	}
	def own = ownLicence(p)
	def ownIsApache = own ==~ apacheBlock.pattern() + /\s*/
	def usesApache = false
	def find = { Map c, String name, String pattern -> // an npm package's own file, for its exact version, else licenses/<name>.<ext>
		c.dir?.listFiles()?.find { it.name ==~ pattern } ?: noticeDirs.collect { new File(it, "${c.name.replace('/', '-')}${name}") }.find { it.isFile() }
	}
	def text = { Map c ->
		def f = find(c, '.txt', /(?i)(licen[cs]e|copying)(\.(md|txt))?/)
		if (!f) return problems << "no licence text for ${c.name}; add licenses/${c.name.replace('/', '-')}.txt"
		readText(f).replaceAll(apacheBlock) {
			usesApache = true
			"\n\nLicensed under the Apache License, Version 2.0, whose text is ${ownIsApache ? 'included above' : 'at the end of this file'}."
		}.trim()
	}
	comps = comps.unique { [it.name, it.version] }.sort { it.name }
	def rule = '=' * 78
	def subs = comps.collect { c -> ">>> ${c.name}${c.version ? " ${c.version}" : ''} (${c.licence}):\n\n${text(c)}\n" }
	if (problems)
		throw new GradleException("META-INF/LICENSE:\n  ${problems.join('\n  ')}")
	['LICENSE', 'NOTICE'].each { new File(out, "META-INF/$it").delete() }
	if (!comps) return
	new File(out, 'META-INF').mkdirs()
	new File(out, 'META-INF/LICENSE').text = "${own}\n\n${rule}\n\nZK ${p.name.toUpperCase()} SUBCOMPONENTS:\n\n" +
		"This jar includes the following subcomponents,\neach with its own copyright notice and license terms. Your use of these\n" +
		"subcomponents is subject to the terms and conditions of the following licenses.\n\n" +
		subs.join('\n') + (usesApache && !ownIsApache ? "\n${rule}\n\nApache License, Version 2.0, as the subcomponents above refer to:\n\n${readText(apacheText)}\n" : '')
	def notices = comps.collect { c -> find(c, '.NOTICE', /(?i)notice(\.(md|txt))?/) }.findAll().unique().collect { readText(it) }
	new File(out, 'META-INF/NOTICE').text = "ZK ${p.name}\nCopyright (C) Potix Corporation. All Rights Reserved.\n\n" +
		"This product includes third-party software, listed with its licenses in\nMETA-INF/LICENSE.\n" + notices.collect { "\n${it}\n" }.join('')
}
subprojects { p ->
	def web = file('src/main/resources/web/js').isDirectory()
	if (web || sbomVendored[p.name])
		plugins.withId('java') {
			def out = layout.buildDirectory.dir('generated/licence')
			def licence = tasks.register('jarLicence') {
				outputs.dir(out)
				outputs.upToDateWhen { false } // reads the frontend bundles and package-lock.json
				dependsOn tasks.matching { it.name == 'compileTypeScript' }
				doLast { writeLicence(p, out.get().asFile) }
			}
			tasks.named('processResources') {
				if (web) dependsOn ':verifySbomVendored'
				from(licence) // through processResources, so jar, evalJar and zkbindIMPLJar all carry it
			}
			tasks.matching { it.name == 'sourcesJar' }.configureEach { from(licence) }
		}
}
