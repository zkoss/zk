def marijn = [name: 'Marijn Haverbeke', url: ['https://codemirror.net']]
def npmCreators = ['@codemirror': marijn, '@lezer': marijn, '@marijn': marijn, 'crelt': marijn, 'style-mod': marijn, 'w3c-keyname': marijn,
                   'tslib': [name: 'Microsoft Corporation', url: ['https://github.com/microsoft/tslib']],
                   '@fontsource-variable/inter': [name: 'The Inter Project Authors', url: ['https://github.com/rsms/inter']],
                   'lucide-static': [name: 'Lucide Icons and Contributors', url: ['https://lucide.dev']]]
def npmLicences = ['tslib': '0BSD', 'lucide-static': 'ISC AND MIT'] // the icons derived from Feather stay MIT
// npm packages scripts/build-css.js copies into a module's jar, so no .src.js bundle names them
def npmAssets = [zul: ['@fontsource-variable/inter', 'lucide-static']]
def npmAssetNames = npmAssets.values().flatten() as Set

// zkcml sets sbomExtra before applying this script; its own modules then carry sbomExtra.licence
def extra = rootProject.findProperty('sbomExtra') ?: [:]
sbomCreators += extra.creators ?: [:]
sbomLicences += extra.licences ?: [:]
sbomVendored += extra.vendored ?: [:]
npmCreators += extra.npmCreators ?: [:]
npmLicences += extra.npmLicences ?: [:]
def zkRoot = buildscript.sourceFile.parentFile
def moduleDir = { String name -> rootProject.findProject(":$name")?.projectDir ?: new File(zkRoot, name) }
def jarOf = { String name, version -> new File(moduleDir(name), "build/libs/${name}-${version}.jar") }

def resolveVendored = { Collection modules ->
	def problems = [] as LinkedHashSet
	def imports = ~/(?:require\(\s*|import\s+(?!type\s)(?:[^'"]*?\s+from\s+)?|export\s+[^'"]*?\s+from\s+)['"](\.[^'"]+)['"]/
	def resolved = modules.collectEntries { module ->
		def resources = new File(moduleDir(module), 'src/main/resources')
		def files = sbomVendored[module] ?: []
		def listed = (files*.file + files*.also.flatten().findAll()) as Set
		def path = { File f -> resources.canonicalFile.toURI().relativize(f.canonicalFile.toURI()).path }
		def js = rootProject.fileTree(new File(resources, 'web/js'))
		js.matching { include '**/ext/**'; exclude '**/*.d.ts', '**/.*', '**/.*/**' }.each { f ->
			if (!listed.contains(path(f))) problems << "${module}: ${path(f)} is not listed in sbomVendored".toString()
		}
		js.matching { include '**/*.ts'; exclude '**/*.d.ts' }.each { ts ->
			(ts.text =~ imports).each { match, spec ->
				def target = ['', '.js', '.mjs', '.ts', '/index.ts'].collect { new File(ts.parentFile, spec + it) }.find { it.isFile() }
					?: new File(ts.parentFile, spec ==~ /.*\.m?js/ ? spec : "${spec}.js") // generated by the build
				if (!target.name.endsWith('.ts') && !listed.contains(path(target)))
					problems << "${module}: ${path(target)} is not listed in sbomVendored".toString()
			}
		}
		[(module): files.collect { v ->
			def src = v.from ? new File(moduleDir(module), v.from) : new File(resources, v.file)
			def version = v.version
			if (v.stamp) {
				def m = src.getText('ISO-8859-1') =~ v.stamp
				if (m.find()) version = m.group(1)
				else problems << "${module}: ${v.file} no longer matches ${v.stamp}"
			} else if (src.bytes.sha256() != v.sha256)
				problems << "${module}: ${v.file} changed; check its version, then update its sha256"
			v + [version: version, purl: v.npm ? "pkg:npm/${v.npm}@${version}".toString() : v.purl]
		}]
	}
	(new File(zkRoot, 'scripts/build-css.js').text =~ /node_modules\/((?:@[\w.-]+\/)?[\w.-]+)/).each { match, name ->
		if (!(name in npmAssetNames)) problems << "scripts/build-css.js copies npm package ${name}; list it in npmAssets".toString()
	}
	if (problems)
		throw new GradleException("SBOM: update sbom.gradle:\n  ${problems.join('\n  ')}")
	resolved
}

tasks.register('verifySbomVendored') {
	doLast { resolveVendored(rootProject.subprojects.findAll { it.file('src/main/resources/web/js').isDirectory() }*.name) }
}
subprojects {
	if (file('src/main/resources/web/js').isDirectory())
		plugins.withId('java') {
			tasks.named('processResources') { dependsOn ':verifySbomVendored' }
		}
}
tasks.named('check') { dependsOn 'cyclonedxBom' }

tasks.matching { it.name in ['cyclonedxBom', 'cyclonedxBomPe'] }.configureEach { task ->
	task.outputs.upToDateWhen { false } // its inputs miss the vendored files and jars read below
	rootProject.subprojects.each { p -> p.plugins.withId('java') { task.mustRunAfter(p.tasks.named('jar')) } }
	task.doLast {
		def bomFile = new File(task.destination.get(), "${task.outputName.get()}.json")
		try {
			def bom = new JsonSlurper().parse(bomFile)
			def problems = []
			def isZk = { Map c -> c.group in ['org.zkoss.zk', 'org.zkoss.common'] && c.version == project.version }
			def isOwn = { Map c -> extra.licence && (c.name == rootProject.name || rootProject.findProject(":${c.name}")) }
			def digest = { InputStream input ->
				def mds = ['SHA-256', 'SHA-512'].collectEntries { [(it): MessageDigest.getInstance(it)] }
				input.withCloseable { it.eachByte(65536) { byte[] buf, int n -> mds.values()*.update(buf, 0, n) } }
				mds.collect { alg, md -> [alg: alg, content: md.digest().encodeHex().toString()] }
			}
			def fileProps = { String filename, boolean executable, boolean archive ->
				(filename ? [[name: 'bsi:component:filename', value: filename]] : []) + [
					[name: 'bsi:component:executable', value: executable ? 'executable' : 'non-executable'],
					[name: 'bsi:component:archive', value: archive ? 'archive' : 'no archive'],
					[name: 'bsi:component:structured', value: archive ? 'structured' : 'unstructured']]
			}
			// TR-03183-2 reads the deployable's hash from a distribution reference, not from `hashes`
			def addHash = { Map c, String url, List hashes ->
				if (!c.hashes) c.hashes = hashes
				c.externalReferences = (c.externalReferences ?: []) + [[type: 'distribution', url: url, hashes: hashes.findAll { it.alg == 'SHA-512' }]]
			}
			def licenceOf = { Map c ->
				if (isZk(c) || c.is(bom.metadata.component)) return isOwn(c) ? extra.licence : (zkModuleLicences[c.name] ?: zkLicence)
				def key = "${c.group}:${c.name}"
				def listed = sbomLicences["$key:${c.version}"] ?: sbomLicences[key]
				if (listed) return listed
				def ids = c.licenses*.license*.id
				if (ids && !ids.contains(null)) return ids.join(' OR ') // a POM listing several licences offers a choice
				problems << "no SPDX licence for $key; add it to sbomLicences"
				null
			}
			def enrich = { Map c ->
				def creator = sbomCreators.findAll { k, v -> c.group == k || c.group.startsWith("${k}.") }.max { it.key.length() }?.value
				if (creator) {
					c.supplier = creator
					c.manufacturer = creator
				} else problems << "no creator for ${c.group}:${c.name}; add its group to sbomCreators"
				def licence = licenceOf(c)
				if (licence) c.licenses = [[expression: licence, acknowledgement: 'concluded']]
				if (c.purl?.contains('type=jar')) {
					def jar = isZk(c) ? jarOf(c.name, c.version) : null
					def hashes = c.hashes ?: (jar?.exists() ? digest(jar.newInputStream()) : null)
					if (hashes) addHash(c, c.purl, hashes)
					else logger.warn("SBOM: no hash for ${c.purl}")
					c['properties'] = (c['properties'] ?: []) + fileProps("${c.name}-${c.version}.jar", true, true)
				}
			}

			enrich(bom.metadata.component)
			bom.components.each(enrich)

			def owners = bom.components.findAll(isZk)
			def vendoredRefs = [] as Set
			resolveVendored(owners*.name).each { module, files ->
				def owner = owners.find { it.name == module }
				def refs = files.collectEntries { [(it.name): it.purl] }
				def jar = jarOf(module, owner.version)
				files.each { v ->
					def creator = v.creator ?: potix
					def c = [type: 'library', 'bom-ref': v.purl, supplier: creator, manufacturer: creator, name: v.name, version: v.version, purl: v.purl]
					c.licenses = [[expression: v.licence, acknowledgement: 'concluded']]
					if (!v.creator) c.pedigree = [
						ancestors: [[type: 'library', name: v.name, version: v.version, purl: v.purl]],
						patches  : [[type: 'unofficial']],
						notes    : 'Copy bundled in ZK and patched for it, maintained by Potix; keeps the upstream version so advisories still match']
					c['properties'] = fileProps(new File(v.file).name, v.executable != false, false)
					if (jar.exists())
						addHash(c, "${owner.purl}#${v.file}".toString(), new ZipFile(jar).withCloseable { z -> digest(z.getInputStream(z.getEntry(v.file))) })
					else logger.warn("SBOM: no hash for ${v.file}, ${jar} is not built")
					bom.components << c
					bom.dependencies << [ref: v.purl, dependsOn: (v.dependsOn ?: []).collect { refs[it] }]
				}
				vendoredRefs.addAll(files*.purl)
				if (files) bom.dependencies.find { it.ref == owner.'bom-ref' }.dependsOn += files*.purl
			}

			// npm packages webpack bundled, read from each module's built bundles
			def locks = [zkRoot, rootDir].unique().collect { new JsonSlurper().parse(new File(it, 'package-lock.json')).packages }
			def npm = [:]
			owners.each { owner ->
				def jar = jarOf(owner.name, owner.version)
				if (!jar.exists()) {
					logger.warn("SBOM: npm packages of ${owner.name} not listed, ${jar} is not built")
					return
				}
				def keys = (npmAssets[owner.name] ?: []).collect { "node_modules/${it}".toString() } as Set
				new ZipFile(jar).withCloseable { z ->
					def bundles = z.entries().findAll { it.name.endsWith('.src.js') }
					if (!bundles && z.entries().find { it.name.startsWith('web/js/') && it.name.endsWith('.js') })
						problems << "${jar.name} has no .src.js bundles to read its npm packages from"
					bundles.each { e ->
						(z.getInputStream(e).getText('UTF-8') =~ /((?:node_modules\/(?:@[\w.-]+\/)?[\w.-]+\/)+)/).each { match, chain -> keys << chain[0..-2] }
					}
				}
				keys.each { key ->
					def e = locks.findResult { it[key] }
					if (!e) return
					def name = key.substring(key.lastIndexOf('node_modules/') + 13)
					def purl = "pkg:npm/${name.replace('@', '%40')}@${e.version}".toString()
					if (purl in vendoredRefs) return
					npm.computeIfAbsent(purl) { [name: name, entry: e, owners: [] as Set] }.owners << owner.'bom-ref'
				}
			}
			npm.each { purl, n ->
				def creator = npmCreators.find { k, v -> n.name == k || n.name.startsWith("${k}/") }?.value
				def licence = npmLicences[n.name] ?: (n.entry.license instanceof String ? n.entry.license : null)
				if (!creator) problems << "no creator for npm package ${n.name}; add it to npmCreators"
				if (!licence) problems << "no SPDX licence for npm package ${n.name}; add it to npmLicences"
				def c = [type: 'library', 'bom-ref': purl, supplier: creator, manufacturer: creator, name: n.name, version: n.entry.version, purl: purl,
				         licenses: [[expression: licence, acknowledgement: 'concluded']], properties: fileProps(null, !(n.name in npmAssetNames), false)]
				if (n.entry.integrity?.startsWith('sha512-'))
					addHash(c, n.entry.resolved, [[alg: 'SHA-512', content: n.entry.integrity.substring(7).decodeBase64().encodeHex().toString()]])
				bom.components << c
				def deps = (n.entry.dependencies ?: [:]).keySet().collect { d -> npm.find { k, o -> o.name == d }?.key }.findAll()
				bom.dependencies << [ref: purl, dependsOn: deps]
			}
			def depended = bom.dependencies.findAll { npm[it.ref] }*.dependsOn.flatten() as Set
			def bare = ~/(?:require\(\s*|import\s+(?!type\s)(?:[^'"]*?\s+from\s+)?|export\s+[^'"]*?\s+from\s+)['"]([^.'"][^'"]*)['"]/
			owners.each { owner ->
				def imported = rootProject.fileTree(new File(moduleDir(owner.name), 'src/main/resources/web/js')).matching { include '**/*.ts'; exclude '**/*.d.ts' }
					.collectMany { ts -> (ts.text =~ bare).collect { match, spec -> spec.split('/').take(spec.startsWith('@') ? 2 : 1).join('/') } } as Set
				def direct = npm.findAll { purl, n -> owner.'bom-ref' in n.owners && (n.name in imported || !depended.contains(purl)) }.keySet()
				if (direct) bom.dependencies.find { it.ref == owner.'bom-ref' }.dependsOn += direct
			}

			if (problems)
				throw new GradleException("SBOM:\n  ${problems.join('\n  ')}")
			bom.metadata.lifecycles = [[phase: 'build']]
			bom.metadata.manufacturer = potix
			bom.metadata.supplier = potix
			bom.compositions = [[aggregate: 'complete', dependencies: bom.dependencies*.ref]]
			bomFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(bom))

			// deploy-script makes the Eval SBOM by renaming versions, but EE Eval jars differ from the official ones
			def evalHashes = bom.components.findAll { isOwn(it) && it.purl?.contains('type=jar') }.collectEntries { c ->
				def jar = new File(moduleDir(c.name), "build/libs/eval/${c.name}-${c.version}.jar")
				jar.exists() ? [(c.'bom-ref'): digest(jar.newInputStream())] : [:]
			}
			def evalFile = new File(bomFile.parentFile, "${task.outputName.get()}-eval.json")
			evalFile.delete()
			if (evalHashes) {
				def eval = new JsonSlurper().parseText(bomFile.text)
				eval.serialNumber = "urn:uuid:${UUID.randomUUID()}".toString()
				eval.components.findAll { evalHashes[it.'bom-ref'] }.each { c ->
					c.hashes = evalHashes[c.'bom-ref']
					c.externalReferences.find { it.type == 'distribution' }.hashes = c.hashes.findAll { it.alg == 'SHA-512' }
				}
				evalFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(eval))
			}
		} catch (e) {
			bomFile.delete() // never ship the plugin's raw output in place of the enriched one
			throw e
		}
	}
}
