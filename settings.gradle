rootProject.name = 'zkroot'

include(':zkplus')
include(':zweb-dsp')
include(':zk')
include(':zhtml')
include(':zweb')
include(':zel')
include(':zkbind')
// include(':zktest')
include(':zcommon')
include(':zkwebfragment')
include(':zul')

// zkcml (EE) is optional: without the sibling checkout only the CE jars are built
def zkcmlDir = new File(rootDir, "../zkcml")
if (zkcmlDir.isDirectory()) {
    includeBuild zkcmlDir
} else {
    logger.lifecycle("[zk] ${zkcmlDir.canonicalPath} not found, building the CE jars only")
}
includeBuild new File(rootDir, "zksandbox")

if (System.getProperty("user.name") != "zkoss") {
    includeBuild new File(rootDir, "zktest")
    includeBuild new File(rootDir, "zkthemelab")
}
