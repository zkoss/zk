// Script for release

// Validate OSGi headers in all JARs before release
task validateOSGiHeaders {
	description = 'Validates that all JAR files contain correct OSGi manifest headers (run after building JARs)'
	group = 'verification'

	// This task should run after JARs are built
	mustRunAfter 'build'
	subprojects.each { subproject ->
		mustRunAfter "${subproject.path}:jar"
		mustRunAfter "${subproject.path}:sourcesJar"
	}

	doLast {
		def errors = []
		def warnings = []
		def successCount = 0
		def totalJars = 0
		def reportFile = file("${project.buildDir}/osgi-validation-report.txt")

		// Ensure build dir exists
		if (!reportFile.parentFile.exists()) {
			reportFile.parentFile.mkdirs()
		}

		reportFile.write("OSGi Validation Report\n")
		reportFile.append("Generated at: ${new Date()}\n")
		reportFile.append("=" * 80 + "\n\n")

		println "=" * 80
		println "Validating OSGi Headers in All JAR Files"
		println "=" * 80

		// Check if we should fail on missing JARs (default: warn only)
		def failOnMissing = project.hasProperty('validateOSGi.failOnMissing') ?
			project.property('validateOSGi.failOnMissing').toBoolean() : false
		def expectedJavaVersion = JavaVersion.toVersion(jdkVersion)

		// Helper function to validate a single JAR
		def validateJar = { File jarFile, String projectName, boolean isEval ->
			def jarType = isEval ? "eval" : "standard"

			if (!jarFile.exists()) {
				if (failOnMissing) {
					def msg = "❌ JAR not found: ${jarFile.path}"
					errors << msg
					reportFile.append("${msg}\n")
				}
				return
			}

			totalJars++

			try {
				// Extract MANIFEST.MF
				def manifest = new java.util.jar.JarFile(jarFile).manifest
				def attrs = manifest?.mainAttributes

				if (!attrs) {
					def msg = "❌ [$projectName] ($jarType) No manifest found in ${jarFile.name}"
					errors << msg
					reportFile.append("${msg}\n")
					return
				}

				// Required OSGi headers
				def bundleName = attrs.getValue("Bundle-Name")
				def bundleSymbolicName = attrs.getValue("Bundle-SymbolicName")
				def bundleVersion = attrs.getValue("Bundle-Version")
				def bundleManifestVersion = attrs.getValue("Bundle-ManifestVersion")
				def exportPackage = attrs.getValue("Export-Package")
				def importPackage = attrs.getValue("Import-Package")

				def projectErrors = []

				// Validate required headers exist
				if (!bundleManifestVersion) {
					projectErrors << "Missing Bundle-ManifestVersion"
				} else if (bundleManifestVersion != "2") {
					projectErrors << "Bundle-ManifestVersion should be '2', got '${bundleManifestVersion}'"
				}

				if (!bundleName) {
					projectErrors << "Missing Bundle-Name"
				}

				if (!bundleSymbolicName) {
					projectErrors << "Missing Bundle-SymbolicName"
				} else if (bundleSymbolicName != projectName) {
					warnings << "⚠️  [$projectName] ($jarType) Bundle-SymbolicName is '${bundleSymbolicName}', expected '${projectName}'"
				}

				if (!bundleVersion) {
					projectErrors << "Missing Bundle-Version"
				}

				// zkwebfragment is a web fragment with no Java code, so it doesn't need Export/Import-Package
				if (projectName != 'zkwebfragment') {
					if (!exportPackage) {
						projectErrors << "Missing Export-Package"
					}

					if (!importPackage) {
						projectErrors << "Missing Import-Package"
					}
				}

				// Validate standard manifest headers
				def specTitle = attrs.getValue("Specification-Title")
				def specVendor = attrs.getValue("Specification-Vendor")
				def specVersion = attrs.getValue("Specification-Version")
				def implTitle = attrs.getValue("Implementation-Title")
				def implVendor = attrs.getValue("Implementation-Vendor")
				def implVersion = attrs.getValue("Implementation-Version")

				if (!specTitle) projectErrors << "Missing Specification-Title"
				if (!specVendor) projectErrors << "Missing Specification-Vendor"
				if (!specVersion) projectErrors << "Missing Specification-Version"
				if (!implTitle) projectErrors << "Missing Implementation-Title"
				if (!implVendor) projectErrors << "Missing Implementation-Vendor"
				if (!implVersion) projectErrors << "Missing Implementation-Version"

				// Validate Export-Package content
				if (exportPackage) {
					// Check if Export-Package starts with just "*" (wildcard without specific packages)
					if (exportPackage.trim().startsWith("*;") || exportPackage.trim() == "*") {
						warnings << "⚠️  [$projectName] ($jarType) Export-Package uses wildcard '*' instead of listing specific packages"
					}
					// Check for invalid character '!' which usually indicates failed exclusion logic
					if (exportPackage.contains('!')) {
						projectErrors << "Export-Package contains invalid character '!', possibly failed Bnd exclusion directive"
					}
				}

				// Special validations for specific projects
				if (projectName == 'zweb' && importPackage) {
					if (!importPackage.contains('javax.servlet.annotation')) {
						warnings << "⚠️  [$projectName] ($jarType) Should import javax.servlet.annotation"
					}
				}

				if (projectName == 'zkbind' && importPackage) {
					if (!importPackage.contains('javassist.util.proxy')) {
						warnings << "⚠️  [$projectName] ($jarType) Should import javassist.util.proxy"
					}
				}

				if (projectName == 'zkex') {
					if (importPackage && !importPackage.contains('org.zkoss.zk.ui.sys')) {
						warnings << "⚠️  [$projectName] ($jarType) Should import org.zkoss.zk.ui.sys"
					}
					// Check that org.zkoss.zk.ui.sys is NOT in the Export-Package list
					if (exportPackage) {
						def simpleExport = exportPackage.replaceAll(/"[^"]*"/, "")
						if (simpleExport.contains('org.zkoss.zk.ui.sys')) {
                             // Double check if it's really the package or just a substring (e.g. org.zkoss.zk.ui.sys.something)
                             // Since we simplified, a simple contains might be risky, but usually package names are distinct enough
                             // Let's rely on the previous logic if it was robust, or just warn.
                             // Actually, the regex replacement removes version attributes.
                             // Splitting by comma is safer.
                             def exportedPackages = simpleExport.split(',').collect { it.split(';')[0].trim() }
                             if (exportedPackages.contains('org.zkoss.zk.ui.sys')) {
 							    warnings << "⚠️  [$projectName] ($jarType) Should not export org.zkoss.zk.ui.sys"
                             }
						}
					}
				}

				if (projectName == 'zweb-dsp') {
					def fragmentHost = attrs.getValue("Fragment-Host")
					if (!fragmentHost) {
						projectErrors << "Missing Fragment-Host header"
					} else if (!fragmentHost.contains('zweb')) {
						projectErrors << "Fragment-Host should reference 'zweb', got '${fragmentHost}'"
					}
				}

				// ZK-6167: every class must target jdkVersion; bnd's osgi.ee only reflects the highest version in the jar
				new java.util.jar.JarFile(jarFile).withCloseable { jf ->
					def bad = jf.entries().toList().findAll { it.name.endsWith('.class') }.findResults { e ->
						def v = new DataInputStream(jf.getInputStream(e)).withCloseable { it.readInt(); [it.readUnsignedShort(), it.readUnsignedShort()] }
						v[0] == 0 && JavaVersion.forClassVersion(v[1]) == expectedJavaVersion ? null : "${e.name} (${v[1]}.${v[0]})"
					}
					if (bad)
						projectErrors << "class file not Java ${jdkVersion}: ${bad.take(5).join(', ')}${bad.size() > 5 ? " (+${bad.size() - 5})" : ''}"
				}

				if (projectErrors.isEmpty()) {
					successCount++
					println "✅ [$projectName] ($jarType) ${jarFile.name}"
					reportFile.append("✅ [$projectName] ($jarType) OK\n")
				} else {
					def errorMsg = "❌ [$projectName] ($jarType) ${jarFile.name}: ${projectErrors.join(', ')}"
					errors << errorMsg
					reportFile.append("${errorMsg}\n")
				}

			} catch (Exception e) {
				def msg = "❌ [$projectName] ($jarType) Failed to validate ${jarFile.name}: ${e.message}"
				errors << msg
				reportFile.append("${msg}\n")
			}
		}

		// Validate ZK subprojects (standard JARs)
		println "\nValidating ZK subprojects..."
		reportFile.append("\nValidating ZK subprojects...\n")
		println "-" * 80
		zkprojects.each { prjName, dir ->
			if (prjName != 'za11y' && prjName != 'zkex' && prjName != 'zkmax' &&
			    prjName != 'zml' && prjName != 'zuti' && prjName != 'stateless' &&
			    prjName != 'stateless-immutable' && prjName != 'client-bind') {
				def jarFile = new File("${dir}/build/libs/${prjName}-${project.version}.jar")
				validateJar(jarFile, prjName, false)
			}
		}

		// Validate ZKCML subprojects
		if (gradle.includedBuilds.find {it.name == 'zkcml'} != null) {
			println "\nValidating ZKCML subprojects (standard)..."
			reportFile.append("\nValidating ZKCML subprojects (standard)...\n")
			println "-" * 80
			zkcmlprojects.each { prjName, dir ->
				def jarFile = new File("${dir}/build/libs/${prjName}-${project.version}.jar")
				validateJar(jarFile, prjName, false)
			}

			println "\nValidating ZKCML subprojects (eval)..."
			reportFile.append("\nValidating ZKCML subprojects (eval)...\n")
			println "-" * 80
			zkcmlprojects.each { prjName, dir ->
				if (prjName != 'stateless-mock' && prjName != 'stateless-processor') {
					def evalJarFile = new File("${dir}/build/libs/eval/${prjName}-${project.version}.jar")
					validateJar(evalJarFile, prjName, true)
				}
			}
		}

		// Validate sources JARs
		println "\nValidating sources JARs..."
		reportFile.append("\nValidating sources JARs...\n")
		println "-" * 80
		zkprojects.each { prjName, dir ->
			if (prjName != 'za11y' && prjName != 'zkex' && prjName != 'zkmax' &&
			    prjName != 'zml' && prjName != 'zuti' && prjName != 'stateless' &&
			    prjName != 'stateless-immutable' && prjName != 'client-bind') {
				def sourcesJarFile = new File("${dir}/build/libs/${prjName}-${project.version}-sources.jar")
				if (sourcesJarFile.exists()) {
					validateJar(sourcesJarFile, prjName, false)
				}
			}
		}

		if (gradle.includedBuilds.find {it.name == 'zkcml'} != null) {
			zkcmlprojects.each { prjName, dir ->
				if (prjName != 'stateless-mock' && prjName != 'stateless-processor') {
					def sourcesJarFile = new File("${dir}/build/libs/${prjName}-${project.version}-sources.jar")
					if (sourcesJarFile.exists()) {
						validateJar(sourcesJarFile, prjName, false)
					}
				}
			}
		}

		// Print summary
		def summary = """
${"=" * 80}
Validation Summary
${"=" * 80}
Total JARs validated: ${totalJars}
✅ Success: ${successCount}
❌ Errors: ${errors.size()}
⚠️  Warnings: ${warnings.size()}
"""
		println summary
		reportFile.append(summary)

		// Print warnings
		if (!warnings.isEmpty()) {
			def warnHeader = """
${"=" * 80}
Warnings:
${"=" * 80}
"""
			println warnHeader
			reportFile.append(warnHeader)
			warnings.each {
				println it
				reportFile.append("${it}\n")
			}
		}

		// Print errors
		if (!errors.isEmpty()) {
			def errHeader = """
${"=" * 80}
Errors:
${"=" * 80}
"""
			println errHeader
			reportFile.append(errHeader)
			errors.each {
				println it
				reportFile.append("${it}\n")
			}
			println "=" * 80
			reportFile.append("=" * 80 + "\n")
			throw new GradleException("OSGi headers validation failed! Found ${errors.size()} error(s). See ${reportFile.path} for details.")
		}

		println "\n🎉 All OSGi headers are valid!"
		println "=" * 80
		println "Report saved to: ${reportFile.path}"
		reportFile.append("\n🎉 All OSGi headers are valid!\n")
	}
}

subprojects {
	afterEvaluate {
		// generate Publishing tasks each project, you can check these tasks with 'gradle task' command
		publishing {
			publications {
				"$project.name"(MavenPublication) {
					groupId = "${group}"
					artifactId = project.name
					// pom configuration
					pom {
						name = project.description
						url = "https://www.zkoss.org/$project.name"
						description = project.description
						licenses {
							license {
								name = project.name == 'zel' ? 'Apache License, Version 2.0' : 'GNU LESSER GENERAL PUBLIC LICENSE, Version 2.1'
								url = project.name == 'zel' ? 'https://www.apache.org/licenses/LICENSE-2.0' : 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
								distribution = 'repo'
							}
						}
						developers {
							developer {
								id = 'zkteam'
								name = 'ZK Team'
								email = 'info@zkoss.org'
								url = 'https://www.zkoss.org'
								organization = 'Potix'
								organizationUrl = 'https://www.zkoss.org'
								roles = ['architect', 'developer']
								timezone = '8'
								properties = [
									picUrl: 'https://www.zkoss.org'
								]
							}
						}
						scm {
							connection = 'scm:git:https://github.com/zkoss/zk.git'
							url = 'https://mavensync.zkoss.org/maven2'
						}
						withXml {
							// add repositories in generated pom
							def repositoriesNode = asNode().appendNode('repositories')
							project.repositories.each {repository ->
								if (repository instanceof MavenArtifactRepository && repository.name != 'MavenRepo') {
									def repositoryNode = repositoriesNode.appendNode('repository')
									repositoryNode.appendNode('id', repository.name)
									repositoryNode.appendNode('url', repository.url)
								}
							}
							// add provided dependency in generated pom
							project.configurations.compileOnly.allDependencies.each { dependency ->
								asNode().dependencies[0].appendNode("dependency").with {
									it.appendNode("groupId", dependency.group)
									it.appendNode("artifactId", dependency.name)
									it.appendNode("version", dependency.version)
									it.appendNode("scope", "provided")
								}
							}
						}
					}
					// add dependencies to pom
					afterEvaluate {
						from(components.java)
					}
					suppressAllPomMetadataWarnings()
				}
			}
		}

		// move & rename default-pom.xml
		task preparePomFile(type: Copy) {
			dependsOn(rootProject.tasks.withType(GenerateMavenPom))
			into file("$projectDir/build/pom")
			from file("$rootDir/build/publications/$project.name")
			include '**/pom-default.xml'
			rename 'pom-default.xml', 'pom.xml'
			setDuplicatesStrategy(DuplicatesStrategy.INCLUDE)
		}

		// combine jar, source.jar, javadoc.jar & pom.xml into one bundle.jar
		task bundleJar(type: Jar) {
			dependsOn 'jar'
			dependsOn 'sourcesJar'
			dependsOn 'javadocJar'
			dependsOn 'preparePomFile'
			dependsOn(project.getTasksByName('bundleAPIJar', false))
			dependsOn(project.getTasksByName('bundleIMPLJar', false))
			archiveClassifier = "bundle"
			def elementName = "${project.name}-${project.version}"
			from("$buildDir/pom") {
				exclude "**/api", "**/impl"
			}
			from("$buildDir/libs") {
				include "**/${elementName}.jar"
				include "**/${elementName}-sources.jar"
				include "**/${elementName}-javadoc.jar"
				// to prevent zkbind-api zkbind-impl been included
				exclude "**/api", "**/impl"
				setDuplicatesStrategy(DuplicatesStrategy.INCLUDE)
			}
		}
	}
}

// bin part

// zkdoc/THIRD-PARTY-LICENSES heads each dist/lib jar's entry `>>> <jar>  <group>:<artifact> <version>  ...`; ZK's own themes give no version
def thirdPartyHeadings = { file("$rootDir/zkdoc/THIRD-PARTY-LICENSES").readLines().findAll { it.startsWith('>>> ') } }
def headingGav = { String heading -> heading =~ /^>>> \S+\s+([\w.-]+):([\w.-]+) (\S+)/ }

task prepareBin() {
	subprojects.each {
		dependsOn ":$it.name:jar"
		dependsOn ":$it.name:sourcesJar"
	}
	zkcmlprojects.each { prjName, dir ->
		if (gradle.includedBuilds.find {it.name == 'zkcml'} != null) {
			dependsOn gradle.includedBuild('zkcml').task(":$prjName:jar")
			dependsOn gradle.includedBuild('zkcml').task(":$prjName:sourcesJar")
			dependsOn gradle.includedBuild('zkcml').task(":$prjName:evalJar")
		}
	}
	if (gradle.includedBuilds.find {it.name == 'zkcml'} != null) {
		dependsOn gradle.includedBuild('zksandbox').task(":war")
	}
	doLast {
		// xsd
		copy {
			into "$buildDir/tmp/eebin/dist/xsd"
			from("$rootDir/zul/src/main/resources/metainfo/xml") {
				include "**/*.xsd"
			}
		}
		// zweb WEB-INF/tld/
		copy {
			into "$buildDir/tmp/eebin/dist/WEB-INF/tld/web"
			from("$rootDir/zweb/src/main/resources/web/WEB-INF/tld/web") {
				include "**/*.tld"
			}
		}
		// zk WEB-INF/tld/
		copy {
			into "$buildDir/tmp/eebin/dist/WEB-INF/tld/zk"
			from("$rootDir/zk/src/main/resources/web/WEB-INF/tld/zk") {
				include "**/*.tld"
			}
		}
		// ext lib jars
		copy {
			into "$buildDir/tmp/eebin/dist/lib/ext"
			from("$rootDir/dist/lib/ext") {
				include "**/bsh.jar"
				include "**/commons-collections4.jar"
				include "**/commons-fileupload2-javax.jar"
				include "**/commons-fileupload2-core.jar"
				include "**/commons-io.jar"
				include "**/commons-logging.jar"
				include "**/encoder.jar"
				include "**/Filters.jar"
				include "**/gson.jar"
				include "**/guava.jar"
				include "**/httpcore5.jar"
				include "**/jackson-databind.jar"
				include "**/jasperreports.jar"
				include "**/javassist.jar"
				include "**/jcommon.jar"
				include "**/jfreechart.jar"
				include "**/openpdf.jar"
				include "**/reflections.jar"
				include "**/slf4j-api.jar"
				include "**/zsoup.jar"
			}
		}
		// theme jars
		copy {
			includeEmptyDirs false
			into "$buildDir/tmp/eebin/dist/lib/theme"
			from("$rootDir/dist/lib") {
				include "**/iceblue_c.jar"
				include "**/iceblue.jar"
			}
		}
		// zkforge jars
		copy {
			includeEmptyDirs false
			into "$buildDir/tmp/eebin/dist/lib/zkforge"
			from("$rootDir/dist/lib") {
				include "**/gmapsz.jar"
				include "**/zuljsp.jar"
			}
		}
		// each of them needs its entry in zkdoc/THIRD-PARTY-LICENSES, which every bin's doc/ ships; an ext entry's version is checked against
		// the jar's pom.properties or else its manifest's Implementation-Version when the jar has either, a theme's against the jar its bundle holds
		def headings = thirdPartyHeadings()
		def stale = ['ext', 'theme', 'zkforge'].collectMany { dir ->
			file("$buildDir/tmp/eebin/dist/lib/$dir").listFiles().findResults { jar ->
				def heading = headings.find { it.startsWith(">>> ${jar.name} ") }
				if (!heading) return "dist/lib/$dir/${jar.name} has no entry"
				def gav = headingGav(heading)
				def held = heading =~ /holding (\S+\.jar)/
				new java.util.jar.JarFile(jar).withCloseable { z ->
					if (held.find()) return z.getEntry(held.group(1)) ? null : "dist/lib/$dir/${jar.name} does not hold the ${held.group(1)} its entry names"
					if (!gav.find()) return dir == 'ext' ? "dist/lib/ext/${jar.name}'s entry names no group:artifact version" : null // ZK's own themes and add-ons
					def poms = z.entries().findAll { it.name ==~ /META-INF\/maven\/[^\/]+\/[^\/]+\/pom\.properties/ }
						.collect { e -> z.getInputStream(e).withCloseable { input -> new Properties().tap { load(input) } } }
					def pom = poms.find { it.groupId == gav.group(1) && it.artifactId == gav.group(2) }
					if (poms && !pom) return "dist/lib/$dir/${jar.name} holds no ${gav.group(1)}:${gav.group(2)}, which its entry names"
					def version = pom?.version ?: z.manifest?.mainAttributes?.getValue('Implementation-Version')?.tokenize()?.getAt(0)
					version && version != gav.group(3) ? "dist/lib/$dir/${jar.name} is ${version}, its entry says ${gav.group(3)}" : null
				}
			}
		}
		if (stale)
			throw new GradleException("zkdoc/THIRD-PARTY-LICENSES:\n  ${stale.join('\n  ')}")
		zkprojects.each { prjName, dir ->
			// subprojects jars
			copy {
				into "$buildDir/tmp/eebin/dist/lib"
				from("$dir/build/libs/${prjName}-${project.version}.jar") {
					rename "${prjName}-${project.version}.jar", "${prjName}.jar"
				}
			}
			// subprojects sources jars
			copy {
				into "$buildDir/tmp/eebin/dist/src"
				from("$dir/build/libs/${prjName}-${project.version}-sources.jar") {
					rename "${prjName}-${project.version}-sources.jar", "${prjName}-sources.jar"
				}
			}
		}
		// doc
		copy {
			into "$buildDir/tmp/eebin/doc"
			from "$rootDir/SECURITY.md"
			from("$rootDir/zkdoc") {
				include "**/release-note"
				include "**/THIRD-PARTY-LICENSES"
			}
			from("$rootDir/../zkcml/cmldoc/CML_LICENSE") {
				rename "CML_LICENSE", "LICENSE"
			}
		}

		// prepare ce
		copy {
			includeEmptyDirs false
			into "$buildDir/tmp/cebin"
			from("$buildDir/tmp/eebin") {
				// lib/ext
				exclude "**/commons-collections4.jar"
				exclude "**/commons-logging.jar"
				exclude "**/Filters.jar"
				exclude "**/gson.jar"
				exclude "**/openpdf.jar"
				exclude "**/jasperreports.jar"
				exclude "**/jfreechart.jar"
				exclude "**/jcommon.jar"
				// lib/zkforge
				exclude "**/gmapsz.jar"
				exclude "**/zuljsp.jar"
				// cml
				exclude "**/za11y*.jar", "**/zkmax*.jar", "**/zuti*.jar", "**/zkex*.jar", "**/zml*.jar", "**/stateless*.jar", "**/client-bind*.jar"
				// doc
				exclude "**/doc"
			}
		}
		copy {
			into "$buildDir/tmp/cebin/doc"
			from "$rootDir/SECURITY.md"
			from "$rootDir/zkdoc"
		}
	}
}

task processBins() {
	doLast {
		// prepare ee
		copy {
			into "$buildDir/tmp/eebin/dist/lib"
			from("zk/build/libs/zk-${project.version}.jar") {
				rename "zk-${project.version}.jar", "zk.jar"
			}
		}
	}

}

task processJar(type: Jar) {
	archiveClassifier = "bundle"
	def elementName = "zk-${project.version}"
	from("zk/build/pom") {
		exclude "**/api", "**/impl"
	}
	from("zk/build/libs") {
		include "**/${elementName}.jar"
		include "**/${elementName}-sources.jar"
		include "**/${elementName}-javadoc.jar"
		setDuplicatesStrategy(DuplicatesStrategy.INCLUDE)
	}
	archiveBaseName.set('zk')
	destinationDirectory.set(file("zk/build/libs"))
	doLast {
		copy {
			includeEmptyDirs false
			into "$buildDir/maven/EE-eval"
			from("zk/build/libs") {
				include "**/*-bundle.jar"
			}
		}
		copy {
			includeEmptyDirs false
			into "$buildDir/maven/PE-eval"
			from("zk/build/libs") {
				include "**/*-bundle.jar"
			}
		}
		copy {
			includeEmptyDirs false
			into "$buildDir/maven/proprietary/EE"
			from("zk/build/libs") {
				include "**/*-bundle.jar"
				exclude "eval/**"
			}
		}
		copy {
			includeEmptyDirs false
			into "$buildDir/maven/proprietary/PE"
			from("zk/build/libs") {
				include "**/*-bundle.jar"
				exclude "eval/**"
			}
		}
	}
}

