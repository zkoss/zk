						includeEmptyDirs false
						into "$buildDir/maven/PE-eval"
						from("$dir/build/libs/eval") {
							include "**/*-bundle.jar"
						}
					}
				}
			}
		}
	}
}

task zkBinsAndBundles {
	// maven bundles
	dependsOn ceBundles
	dependsOn zkBins
}

task cmlBinsAndBundles {
	if (gradle.includedBuilds.find {it.name == 'zkcml'} != null) {
		dependsOn 'peBundles'
		dependsOn 'eeBundles'
		dependsOn 'peEvalBundles'
		dependsOn 'eeEvalBundles'
	}
	dependsOn cmlBins
}

task packageBomMavenProjects() {
	doLast {
		['zk-bom', 'zk-parent'].each { dir ->
			def projectDir = file("$rootDir/$dir")
			if (projectDir.exists()) {
				println "Executing 'mvn package' in $projectDir"
				exec {
					workingDir projectDir
					commandLine 'mvn', 'clean', 'package'
				}
				copy {
					into "$buildDir/maven/CE"
					from("$projectDir/debug") {
						include "*-bundle.jar"
					}
				}
				copy {
					into "$buildDir/maven/PE-eval"
					from("$projectDir/debug") {
						include "*-bundle.jar"
					}
				}
				copy {
					into "$buildDir/maven/EE-eval"
					from("$projectDir/debug") {
						include "*-bundle.jar"
					}
				}
				copy {
					into "$buildDir/maven/proprietary/PE"
					from("$projectDir/debug") {
						include "*-bundle.jar"
					}
				}
				copy {
					into "$buildDir/maven/proprietary/EE"
					from("$projectDir/debug") {
						include "*-bundle.jar"
					}
				}
			} else {
				println "Directory $projectDir does not exist"
			}
		}
	}
}

task binsAndBundles {
	// Validate OSGi headers before packaging
	dependsOn(validateOSGiHeaders)

	// zksandbox
	dependsOn(zksandboxZip)
	dependsOn(packageBomMavenProjects)
	zksandboxZip.dependsOn(cmlBinsAndBundles)
	cmlBinsAndBundles.dependsOn(processJar)
	processJar.dependsOn(processBins)
	processBins.dependsOn(zkBinsAndBundles)
	packageBomMavenProjects.dependsOn(cmlBinsAndBundles)

	// Ensure validation runs after all JARs are built
	validateOSGiHeaders.mustRunAfter(zkBinsAndBundles)
	validateOSGiHeaders.mustRunAfter(cmlBinsAndBundles)
}

task release() {
	// check before release
	dependsOn 'check'
	if (gradle.includedBuilds.find {it.name == 'zkcml'} != null) {
		dependsOn gradle.includedBuild('zkcml').task(':check')
	}
	dependsOn binsAndBundles

	// javadoc & jsdoc
	dependsOn 'alljavadoc'
	dependsOn 'alljsdoc'
}
if (gradle.includedBuilds.find {it.name == 'zkcml'} != null) {
	publishToMavenLocal {
		dependsOn gradle.includedBuild('zkcml').task(':publishToMavenLocal')
	}
}

// EE/PE packages need the zkcml jars; without the sibling checkout they would be built empty
gradle.taskGraph.whenReady { graph ->
	if (gradle.includedBuilds.find {it.name == 'zkcml'} == null) {
		def eeTaskNames = ['zkeeBinTar', 'zkeeBinZip', 'zkeeSrcZip', 'zkpeBinTar', 'zkpeBinZip', 'zkpeSrcZip',
			'zkeeBinEvalZip', 'zkpeBinEvalZip', 'eeBundles', 'peBundles', 'eeEvalBundles', 'peEvalBundles',
			'zksandboxZip', 'release']
		if (graph.allTasks.any { it.project == project && it.name in eeTaskNames }) {
			throw new GradleException("EE/PE packaging needs the zkcml checkout at ${file("$rootDir/../zkcml").canonicalPath}")
		}
	}
}
