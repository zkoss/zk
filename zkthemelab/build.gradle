// zkthemelab: the Marble preview host (ZK-6112).
// Its composite build (settings.gradle) mirrors zktest's dependencySubstitution
// against live zk/zkcml sources; its container setup here mirrors zksandbox's gretty skeleton.

plugins {
	id 'war'
	id "org.gretty" version "3.1.1"
}

tasks.withType(JavaCompile) {
	options.release = 17
	options.encoding = 'UTF-8'
}

repositories {
	mavenLocal() {
		content {
			excludeModule "org.zkoss.theme", "iceblue"
		}
	}

	maven {
		url = uri('https://mavensync.zkoss.org/maven2')
	}

	// the iceblue theme jar, as in zktest
	maven {
		url = uri('https://mavensync.zkoss.org/eval')
	}

	maven {
		url = uri('https://repo.maven.apache.org/maven2/')
	}
}

// work for Servlet 3.0
configurations.all {
	exclude group: 'org.zkoss.zk', module: 'zkwebfragment'
}

dependencies {
	implementation "org.zkoss.common:zweb:${version}"
	implementation "org.zkoss.common:zweb-dsp:${version}"
	implementation "org.zkoss.zk:zk:${version}"
	implementation "org.zkoss.zk:zul:${version}"
	implementation "org.zkoss.zk:zhtml:${version}"
	implementation "org.zkoss.zk:zkplus:${version}"
	implementation "org.zkoss.zk:zkbind:${version}"
	implementation "org.zkoss.zk:zkex:${version}"
	implementation "org.zkoss.zk:zkmax:${version}"
	implementation "org.zkoss.zk:zuti:${version}"
	implementation "org.zkoss.zk:za11y:${version}"
	// served only with the zktheme=iceblue cookie (iceblue-theme.spec.ts); WEB-INF/zk.xml keeps Marble the default
	runtimeOnly "org.zkoss.theme:iceblue:11.0.0+"
	runtimeOnly 'org.apache-extras.beanshell:bsh:2.0b6'
	providedCompile 'javax.servlet:servlet-api:2.4'
}

war {
	archiveFileName = 'zkthemelab.war'
}

description = 'ZK Marble preview host'

gretty {
	httpPort = project.hasProperty('httpPort') ? Integer.parseInt(project.httpPort) : 8085
	contextPath = '/'
	reloadOnClassChange = false
}
